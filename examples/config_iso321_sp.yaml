# iso_321.xyz 功能验证配置；相对路径以本文件所在目录为准。
# 先 dry_run: true 预检，再改为 false 计算；更改计算参数时请使用新 output。
chrg: 0
cmetal: 0
crest_mdlen: 1
freeze:
- 1
- 2
- 3
- 5
full_log: true
hardfreeze:
- 1
- 2
- 3
- 5
hb: 0
input: ../input
mlip:
  enable_cueq: false
  gpu_ids:
  - 0
  include_initial_ts: true
  max_conformers: 3
  mode: sp
  model: ../models/MACE-omol.model
output: ../runs/iso321_sp
quick: mquick
resume: true
stage1_only: false
stage1_workers: 1
threads: 4
uhf: 0
workers: 1
dry_run: true
